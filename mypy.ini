[mypy]
python_version = 3.10
files = backend/analyzer.py, backend/main.py, backend/src/codestruct
mypy_path = backend, backend/src
check_untyped_defs = True
disallow_untyped_defs = False
ignore_missing_imports = True
no_implicit_optional = True
show_error_codes = True
warn_redundant_casts = True
warn_unused_configs = True
warn_unused_ignores = True

[mypy-codestruct.analysis.diagnostics,codestruct.analysis.models,codestruct.analysis.policy,codestruct.api.pagination,codestruct.graph.identifiers,codestruct.graph.model,codestruct.jobs.models,codestruct.storage.cache_keys,codestruct.storage.errors,codestruct.storage.migrations,codestruct.storage.models]
disallow_untyped_defs = True
warn_return_any = True
