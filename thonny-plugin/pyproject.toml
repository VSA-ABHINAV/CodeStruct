[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thonny-codestruct"
version = "0.1.0"
description = "CodeStruct architecture analysis plugin for Thonny IDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "thonny",
]

[project.entry-points."thonny.plugins"]
codestruct = "thonnycontrib.codestruct"

[tool.setuptools.packages.find]
where = ["."]
include = ["thonnycontrib*"]
