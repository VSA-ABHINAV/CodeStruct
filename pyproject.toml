[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codestruct"
dynamic = ["version"]
description = "A static Python program-structure and dependency explorer."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
codestruct = "codestruct.cli:main"

[project.optional-dependencies]
metrics = [
    "networkx>=3.0,<4.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "httpx2>=2.0,<3.0",
    "mypy>=1.15,<2.0",
    "networkx>=3.0,<4.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.11,<1.0",
]
release = [
    "build>=1.2,<2.0",
    "wheel>=0.45,<1.0",
]

[tool.setuptools]
package-dir = {"" = "backend/src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "codestruct.__about__.__version__"}

[tool.setuptools.package-data]
codestruct = ["web/**/*"]

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["codestruct*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=backend --cov-report=term-missing --cov-fail-under=84"
pythonpath = ["backend", "backend/src"]
testpaths = ["tests"]
markers = [
    "unit: isolated deterministic tests without external services",
    "contract: public API, serialization, and compatibility-contract tests",
    "integration: tests spanning multiple application components",
    "process: spawned-process and process-lifecycle tests",
    "performance: controlled performance-regression checks",
    "slow: tests intentionally excluded from fast local feedback",
    "platform: tests whose outcome depends on operating-system behavior",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["backend"]
omit = ["backend/test_analyzer.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["frontend", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607"]
"tests/performance/benchmark.py" = ["B023"]
"backend/test_analyzer.py" = ["S101"]
"backend/src/codestruct/api/routes/analyses.py" = ["B008"]
"backend/src/codestruct/api/routes/editor.py" = ["B008"]
"backend/src/codestruct/api/routes/navigate.py" = ["B008"]
"backend/src/codestruct/api/routes/projects.py" = ["B008"]
"thonny-plugin/**/*.py" = ["E402", "S101", "S105", "S106", "S110", "S310"]
"tools/*.py" = ["S101", "S603", "S607"]
"docs/**/*.py" = ["S101", "S603", "S607"]


[tool.mypy]
python_version = "3.10"
files = ["backend/analyzer.py", "backend/main.py", "backend/src/codestruct"]
mypy_path = ["backend", "backend/src"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "codestruct.analysis.diagnostics",
    "codestruct.analysis.models",
    "codestruct.analysis.policy",
    "codestruct.api.pagination",
    "codestruct.graph.identifiers",
    "codestruct.graph.model",
    "codestruct.jobs.models",
    "codestruct.storage.cache_keys",
    "codestruct.storage.errors",
    "codestruct.storage.migrations",
    "codestruct.storage.models",
]
disallow_untyped_defs = true
warn_return_any = true
